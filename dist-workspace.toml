[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax).
# Linux is musl-only so the binary is fully static and runs on any distro.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Build aarch64 Linux natively instead of cross-compiling.
github-custom-runners = { aarch64-unknown-linux-musl = "ubuntu-24.04-arm" }
# Homebrew tap to publish the formula to (repo must exist before the first release).
# Formula name, description, homepage, and license are taken from Cargo.toml.
tap = "AidenHadisi/homebrew-tap"
publish-jobs = ["homebrew"]
