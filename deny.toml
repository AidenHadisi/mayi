[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # rustls + platform-verifier only; no OpenSSL anywhere in the tree.
  { crate = "openssl-sys", reason = "TLS goes through rustls" },
  { crate = "openssl", reason = "TLS goes through rustls" },
  { crate = "native-tls", reason = "TLS goes through rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
